services:
  db:
    image: postgres:15-alpine
    container_name: alpha_db
    environment:
      POSTGRES_DB: alpha_inversiones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: alpha_backend
    environment:
      SECRET_KEY: "django-insecure-alpha-inversiones-change-in-prod"
      DEBUG: "True"
      DB_NAME: alpha_inversiones
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOW_ALL_ORIGINS: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    container_name: alpha_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
